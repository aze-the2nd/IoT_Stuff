; ESP32-2432S028 ("Cheap Yellow Display") — smart RTD sensor
; Board is a generic ESP32-D0WD-V3 module; there is no official PlatformIO
; board id for the CYD, so we use the generic esp32dev target and configure
; the built-in ILI9341 display via TFT_eSPI build flags (avoids editing the
; library's User_Setup.h directly).

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit MAX31865 library @ ^1.6.2
    bblanchon/ArduinoJson @ ^7

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; Default: flash over USB.
[env:cyd]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Wireless flash via ArduinoOTA (LanOta module) — only works once the device
; is already running firmware built from this same project, since that's
; what listens for the OTA invitation. First flash always goes through the
; `cyd` env over USB.
;
; Usage (device IP/hostname may change — pass it explicitly each time):
;   OTA_PASSWORD=<value from secrets.h> pio run -e cyd-ota -t upload --upload-port iot-rtd-sensor.local
;
; OTA_PASSWORD is read from the shell environment on purpose — never commit
; the real password into this tracked file.
[env:cyd-ota]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
