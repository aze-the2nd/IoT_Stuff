; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Even trimmed, NimBLE (needed for Wi-Fi-over-Bluetooth provisioning) doesn't
; fit the default 1.25MB/1.25MB/1.375MB (app0/app1/spiffs) split — it overran
; app0 by ~14KB. The stock min_spiffs table (app ~1.9MB, spiffs 128KB) fixed
; the flash overflow but broke LittleFS at runtime: 128KB proved too tight
; once the 7-day/80KB history file was actively being updated, reproducibly
; crashing with IntegerDivideByZero inside lfs_alloc (see partitions_custom's
; own header comment). This custom table gives app0/app1 ~1.44MB each (still
; comfortable margin over the ~1.33MB BLE build) and spiffs ~1.06MB — close
; to the original working size. NOTE: any partition-table change moves
; offsets, so it can't be applied via OTA — needs one physical USB reflash
; (env:cyd), and that reflash's LittleFS reformat wipes the current on-device
; history/anchor files (the Pi-side keller_temp DB is untouched).
board_build.partitions = partitions_custom.csv
lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	adafruit/Adafruit MAX31865 library @ ^1.6.2
	bblanchon/ArduinoJson @ ^7
	h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D USE_HSPI_PORT=1
	-D TOUCH_CS=33
	-D SPI_TOUCH_FREQUENCY=2500000
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	; NimBLE trimming: this device is a pure GATT peripheral (advertises +
	; accepts one connection for Wi-Fi provisioning), never a central/observer
	; scanning for other BLE devices — disabling those roles and capping
	; connections/logging buys back flash on an already-tight partition
	; (82.5% used before BLE; the untrimmed NimBLE build overflowed by ~25KB).
	-D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
	-D CONFIG_BT_NIMBLE_LOG_LEVEL=0

[env:cyd]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

[env:cyd-ota]
upload_protocol = espota
upload_flags = 
	--auth=${sysenv.OTA_PASSWORD}
